name: fujifilm-recipes-manager

# This stack fills the current gap: there was no Compose file, no db service,
# and no cross-platform host mount configuration for the image library.
# Run it with:
#   docker compose up --build
# Compose interpolation reads `.env`; service-level env vars below set the
# container environment for Django, Postgres, RabbitMQ, and Celery.

x-common-env: &common-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-secret-key}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
  POSTGRES_DB: ${POSTGRES_DB:-fujifilm_recipes}
  POSTGRES_USER: ${POSTGRES_USER:-fujifilm_recipes}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fujifilm_recipes}
  IMAGE_LIBRARY_ROOT: ${IMAGE_LIBRARY_ROOT:-/data/images}
  THUMBNAIL_CACHE_DIR: ${THUMBNAIL_CACHE_DIR:-/data/thumbnail-cache}
  LOG_DIR: ${LOG_DIR:-/data/logs}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@localhost:5672//}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-rpc://}
  PROCESS_IMAGE_QUEUE: ${PROCESS_IMAGE_QUEUE:-celery}

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
    target: dev
  working_dir: /app
  volumes:
    - .:/app
    - type: bind
      source: ${IMAGE_LIBRARY_SOURCE:-/absolute/path/to/your/fujifilm/images}
      target: ${IMAGE_LIBRARY_ROOT:-/data/images}
      read_only: true
    - thumbnail-cache:${THUMBNAIL_CACHE_DIR:-/data/thumbnail-cache}
    - logs:${LOG_DIR:-/data/logs}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fujifilm_recipes}
      POSTGRES_USER: ${POSTGRES_USER:-fujifilm_recipes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fujifilm_recipes}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    <<: *app-common
    environment:
      <<: *common-env
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  rabbitmq:
    image: rabbitmq:3-management
    profiles: ["async"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-fujifilm_recipes}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-fujifilm_recipes}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *app-common
    profiles: ["async"]
    environment:
      <<: *common-env
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "src.config",
        "worker",
        "--loglevel=info",
        "--concurrency=8",
      ]

volumes:
  postgres-data:
  thumbnail-cache:
  logs:
